services:
  oci-path-diag:
    build: .
    image: oci-path-diag:1.0.0
    container_name: oci-path-diag
    ports:
      - "8000:8000"
    restart: unless-stopped
    # 上传归档在容器内的临时目录，独立挂载便于限制空间
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
